name: meu_auto
description: "Meu Auto - controle de manutencao, quilometragem e prazos do seu carro."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+3

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # pt-BR strings for the Material widgets the app does not write itself:
  # date pickers, dialog buttons, the text-selection menu. Without the
  # delegate they fall back to English, which breaks the pt-BR-only rule the
  # moment a screen opens a date picker. Ships with the SDK, not a new package.
  #
  # cupertino_icons was removed: the app uses one Material design language on
  # both platforms (CLAUDE.md), so nothing referenced it.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  # Pinned by flutter_localizations from the SDK — do not bump past it.
  intl: ^0.20.2
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  # Sign in with a fingerprint or a face (26/09/2026, the owner's request,
  # after Pauta): the biometric opens the session already stored on the
  # phone and never stores a password. The two platform packages are listed
  # only because the system prompt's words come from them, and their default
  # is English.
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0
  local_auth_darwin: ^2.0.4
  # Push reminders (26/09/2026, the owner's request, after Pauta), Android only:
  # - firebase_core starts the SDK from android/app/google-services.json;
  # - firebase_messaging holds the phone's token and receives the messages;
  # - flutter_local_notifications draws a message that arrives while the app
  #   is open, because FCM draws nothing then.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  yaml: ^3.1.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/

  # Inter, the one face of the app, under the SIL Open Font License (the OFL
  # text sits beside the files). Subsetted to Latin by the source, which is
  # all pt-BR needs; ~65 KB per weight.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#090C10"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Default is 16. The PNG already sits at 58.2% of the canvas (Android
  # adaptive safe zone is 61%); another inset would shrink the mark.
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#F2F4F7"
  color_dark: "#090C10"
  image: "assets/icon/splash_light.png"
  image_dark: "assets/icon/splash_dark.png"
  web: false
  android_12:
    # A splash do Android 12+ recorta o icone num circulo e mostra apenas os
    # ~66,7% centrais. As splashes normais ocupam 70% e seriam cortadas; aqui
    # vai a marca a 58,2%. No escuro, a camada adaptativa; no claro, o halo
    # escuro dela sujaria o fundo, entao vai a arte limpa da splash clara no
    # mesmo tamanho (tool/android12_light_splash.dart).
    image: "assets/icon/splash_android12_light.png"
    image_dark: "assets/icon/icon_foreground.png"
    color: "#F2F4F7"
    color_dark: "#090C10"
    icon_background_color: "#F2F4F7"
    icon_background_color_dark: "#090C10"
